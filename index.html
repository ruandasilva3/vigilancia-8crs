<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vigilância em Saúde · 8º CRS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<style>
:root{--brand:#0B5E6E;--brand2:#0A4A57;--acc:#5FD4C4;--bg:#F3F6F7;--ink:#142229;--mut:#4A5B62;--line:#DCE4E7;--warn:#FFF1D6;--warnk:#7A4B00;--bad:#FBE3E1;--badk:#8C1D18;--ok:#DDF3EF}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Atkinson Hyperlegible',Arial,sans-serif}
button,input,select,textarea{font:inherit}
.hide{display:none!important}
h1{margin:0;font-size:26px}h2{margin:0;font-size:19px}h3{margin:0;font-size:16px}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--mut)}
input,select,textarea{font-size:15px;color:var(--ink);min-height:42px;padding:0 10px;border:1px solid #B9C7CC;border-radius:8px;background:#fff}
textarea{padding:8px 10px;min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.btn{min-height:42px;border:0;border-radius:9px;background:var(--brand);color:#fff;font-weight:700;padding:0 16px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--brand2)}
.btn.sec{background:#fff;color:var(--brand);border:1px solid var(--brand);font-weight:400}
.btn.sm{min-height:34px;padding:0 11px;font-size:14px}
.btn.red{background:#fff;color:var(--badk);border:1px solid #E3B4AF;font-weight:400}
.btn:disabled{opacity:.5;cursor:default}
.err{color:var(--badk);font-size:14px;min-height:18px}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
#login form{background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px;width:min(380px,100%);display:flex;flex-direction:column;gap:14px}
#app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
nav{background:var(--brand);color:#fff;display:flex;flex-direction:column;gap:3px;padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
nav .t{font-size:18px;font-weight:700;padding:0 8px 4px}
nav .who{font-size:13px;color:#B9DADF;padding:0 8px 14px}
nav .sec{font-size:12px;color:#9FD0D7;padding:14px 10px 4px;text-transform:uppercase;letter-spacing:.04em}
nav a{display:flex;align-items:center;min-height:40px;padding:0 12px;border-radius:9px;color:#E1F1F3;text-decoration:none}
nav a:hover{background:rgba(255,255,255,.1)}
nav a.on{background:#fff;color:var(--brand);font-weight:700}
nav .foot{margin-top:auto;padding-top:16px}
nav .foot button{width:100%;background:none;border:1px solid #6FA9B3;color:#fff;border-radius:8px;min-height:38px;cursor:pointer}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 28px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top label{flex-direction:row;align-items:center;gap:8px}
.demo{background:var(--warn);color:var(--warnk);font-size:13px;padding:6px 12px;border-radius:99px}
main{padding:24px 28px 60px;display:flex;flex-direction:column;gap:18px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.gap{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.sub{font-size:13px;color:var(--mut)}
.muni{font-size:15px;font-weight:700;color:var(--brand);padding:14px 0 6px;border-bottom:2px solid var(--brand);margin-bottom:4px;display:flex;justify-content:space-between}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--mut);font-size:12px;font-weight:400;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-top:1px solid #EEF2F3;vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover td{background:#F7FAFA}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;white-space:nowrap;margin:1px 2px 1px 0}
.c-warn{background:var(--warn);color:var(--warnk)}.c-bad{background:var(--bad);color:var(--badk)}
.c-ok{background:var(--ok);color:var(--brand)}.c-mut{background:#E9ECEE;color:var(--mut)}.c-info{background:#E3EEFB;color:#1B4F8A}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.kpi .l{display:flex;justify-content:space-between;font-size:14px}.kpi b{font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.empty{color:var(--mut);padding:14px 0}
dialog{border:0;border-radius:16px;padding:0;width:min(760px,96vw);max-height:92vh}
dialog::backdrop{background:rgba(10,30,36,.45)}
dialog form,.dlg{padding:22px 24px;display:flex;flex-direction:column;gap:14px}
.det{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px 16px;font-size:14px}
.det div span{display:block;font-size:12px;color:var(--mut)}
.calc td{font-size:15px}.calc input{width:110px;text-align:right}
.ped{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:#fff}
.toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;z-index:99;max-width:420px}
@media(max-width:860px){#app{grid-template-columns:1fr}nav{position:static;height:auto;flex-direction:row;flex-wrap:wrap}nav .sec,nav .who{display:none}nav .foot{margin:0;padding:0}main,.top{padding-left:14px;padding-right:14px}}
.logo{background:#fff;border-radius:10px;padding:8px 10px;margin:0 2px 10px}.logo img{width:100%;display:block}
.org{padding:0 8px 12px;margin-bottom:12px;font-size:13px;line-height:1.35;color:#CFE7EA;border-bottom:1px solid rgba(255,255,255,.22)}.org b{display:block;font-size:15px;color:#fff}
@media(max-width:860px){nav .logo,nav .org{display:none}}
</style>
</head>
<body>

<div id="login" class="hide">
  <form id="fLogin">
    <img class="logoimg" alt="Secretaria de Saúde · Governo do Estado do Pará" style="width:250px;max-width:100%;align-self:center;margin-bottom:4px">
    <div class="sub" style="text-align:center"><b>8º CRS – SESPA</b> · Marajó II</div>
    <h1 style="font-size:24px;text-align:center">Vigilância em Saúde</h1>
    <div class="sub" id="lDemo"></div>
    <label>Usuário<input id="lUser" required autocomplete="username" placeholder="nome do município ou regional"></label>
    <label>Senha<input id="lSenha" type="password" required autocomplete="current-password"></label>
    <button class="btn" type="submit">Entrar</button>
    <div class="err" id="lErr"></div>
  </form>
</div>

<div id="app" class="hide">
  <nav>
    <div class="logo"><img class="logoimg" alt="Secretaria de Saúde · Governo do Estado do Pará"></div>
    <div class="org"><b>8º CRS – SESPA</b>Marajó II</div>
    <div class="t">Vigilância em Saúde</div>
    <div class="who" id="who"></div>
    <a href="#inicio">Início</a>
    <div class="sec">Talidomida</div>
    <a href="#tali-pacientes">Pacientes</a>
    <a href="#tali-dispensacoes">Dispensações</a>
    <div class="sec">Pedidos</div>
    <a href="#ped-trimestral">Pedido Hanseníase</a>
    <a href="#ped-tb">Pedido Tuberculose</a>
    <a href="#ped-analise" class="soReg">Análise de pedidos</a>
    <div class="sec">SINAN</div>
    <a href="#sinan-mh">Hanseníase</a>
    <a href="#sinan-tb">Tuberculose</a>
    <div class="foot"><button id="sair" type="button">Sair</button></div>
  </nav>
  <div>
    <div class="top">
      <div class="gap"><b id="titulo"></b><span class="demo hide" id="demoTag">Demonstração · dados fictícios</span></div>
      <label class="soReg">Município
        <select id="filtro"></select></label>
    </div>
    <main id="main"></main>
  </div>
</div>

<dialog id="dlg"></dialog>

  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/); if (m) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; return `${y}-${pad(m[2])}-${pad(m[1])}`; }
  const dg = s.replace(/\D/g, ''); if (dg.length === 8) { const d = +dg.slice(0,2), mo = +dg.slice(2,4), y = +dg.slice(4); if (d <= 31 && mo <= 12 && y > 1900) return `${y}-${pad(mo)}-${pad(d)}`; }
  return null;
}

const TABELAS = ['tali_pacientes', 'tali_dispensacoes', 'pedidos', 'sinan_casos'];
let perfil = null, D = {tali_pacientes:[], tali_dispensacoes:[], pedidos:[], sinan_casos:[]}, MEM = null, seq = 1000;
const isReg = () => perfil === 'REGIONAL';
const visivel = r => isReg() || r.municipio === perfil;

const db = {
  async load() {
    if (DEMO) { for (const t of TABELAS) D[t] = MEM[t].filter(visivel).map(r => ({...r})); return; }
    for (const t of TABELAS) {
      let all = [], from = 0;
      while (true) { const { data, error } = await sb.from(t).select('*').order('id').range(from, from + 999); if (error) throw error; all = all.concat(data); if (data.length < 1000) break; from += 1000; }
      D[t] = all;
    }
  },
  async insert(t, rows) {
    rows = [].concat(rows);
    if (DEMO) { const out = rows.map(r => ({ id: ++seq, criado_em: new Date().toISOString(), ...r })); MEM[t].push(...out); return out; }
    const { data, error } = await sb.from(t).insert(rows).select(); if (error) throw error; return data;
  },
  async update(t, id, patch) {
    if (DEMO) { Object.assign(MEM[t].find(r => r.id === id), patch); return; }
    const { error } = await sb.from(t).update(patch).eq('id', id); if (error) throw error;
  },
  async del(t, ids) {
    ids = [].concat(ids); if (!ids.length) return;
    if (DEMO) { MEM[t] = MEM[t].filter(r => !ids.includes(r.id)); if (t === 'tali_pacientes') MEM.tali_dispensacoes = MEM.tali_dispensacoes.filter(r => !ids.includes(r.paciente_id)); return; }
    const { error } = await sb.from(t).delete().in('id', ids); if (error) throw error;
  }
};
let ocupado = false;   // evita salvar duas vezes com clique duplo
async function salvar(fn, msg) {
  if (ocupado) return false;
  ocupado = true; document.body.style.cursor = 'progress';
  try { await fn(); await db.load(); render(); if (msg) toast(msg); return true; }
  catch (e) { console.error(e); toast('Não foi possível salvar: ' + (e.message || e)); return false; }
  finally { ocupado = false; document.body.style.cursor = ''; }
}

const cv = v => { if (v && typeof v === 'object' && !(v instanceof Date)) { if (v.richText) return v.richText.map(t => t.text).join(''); if ('result' in v) return v.result; if (v.text) return v.text; } return v; };
const txt = v => { v = cv(v); return v == null || v === '' ? null : String(v instanceof Date ? parseD(v) : v).trim(); };
async function importarTali(file) {
  if (!file) return;
  try {
    const wb = new ExcelJS.Workbook(); await wb.xlsx.load(await file.arrayBuffer());
    const novosP = [], novasD = [], semData = [], semMun = new Set(); let lidas = 0;
    const chave = (cns, nome) => (cns || '').replace(/\D/g, '') || norm(nome);
    const existentes = new Map(D.tali_pacientes.map(p => [chave(p.cns, p.nome), p]));
    for (const ws of wb.worksheets) {
      if (!/^\d{1,2}$/.test(ws.name.trim())) continue;
      const last = Math.min(ws.actualRowCount + 5, 2000);
      for (let i = 4; i <= last; i++) {
        const row = ws.getRow(i), c = n => cv(row.getCell(n).value);
        const nome = txt(c(6)); if (!nome || norm(nome).startsWith('SEM DISP')) continue;
        lidas++;
        const mun = munOf(txt(c(2)) || ''); if (!mun) { semMun.add(txt(c(2)) || '(vazio)'); continue; }
        const k = chave(txt(c(7)), nome);
        let p = existentes.get(k);
        if (!p) { p = { _k: k, municipio: mun, updt: txt(c(4)), cnes: txt(c(5)), nome, cns: txt(c(7)), rg: txt(c(8)), sexo: (txt(c(9)) || '').slice(0, 1).toUpperCase() || null, nascimento: parseD(c(10)),
          mae: txt(c(11)), endereco: txt(c(12)), telefone: txt(c(13)), cid: txt(c(19)), inicio: parseD(c(20)), medico: txt(c(21)), crm: txt(c(22)), ativo: true }; existentes.set(k, p); novosP.push(p); }
        const data = parseD(c(14));
        if (!data) { semData.push(`aba ${ws.name}, linha ${i}: ${nome}`); continue; }
        novasD.push({ _k: k, municipio: p.municipio, data, quantidade: parseInt(txt(c(15))) || null, lote: txt(c(16)), validade: parseD(c(17)), receita: txt(c(18)),
          medico: txt(c(21)), crm: txt(c(22)), farmaceutico: txt(c(23)), crf: txt(c(24)) });
      }
    }
    const jaD = new Set(D.tali_dispensacoes.map(d => d.paciente_id + '|' + d.data + '|' + d.quantidade));
    const dup = novasD.filter(d => { const p = existentes.get(d._k); return p && p.id && jaD.has(p.id + '|' + d.data + '|' + d.quantidade); }).length;
    const resumo = `${lidas} linha(s) lidas · ${novosP.length} paciente(s) novos · ${novasD.length - dup} dispensação(ões) novas` + (dup ? ` · ${dup} já cadastrada(s), serão ignoradas` : '') + (semData.length ? ` · ${semData.length} sem data legível` : '') + (semMun.size ? ` · município não reconhecido: ${[...semMun].join(', ')}` : '');
    dlg(`<div class="dlg"><h2>Importar planilha antiga</h2><div>${esc(resumo)}</div>
      ${semData.length ? `<div class="sub">Linhas com data da dispensação que não deu para ler (corrija na planilha ou cadastre à mão depois):<br>${semData.slice(0, 15).map(esc).join('<br>')}${semData.length > 15 ? '<br>…' : ''}</div>` : ''}
      <div class="sub">Pacientes repetidos são reconhecidos pelo CNS (ou pelo nome, quando não há CNS). Dispensações iguais já cadastradas não são duplicadas.</div>
      <div class="row"><span></span><div class="gap"><button class="btn sec" data-a="fechar">Cancelar</button><button class="btn" id="impOk">Importar</button></div></div></div>`);
    $('impOk').onclick = async () => { $('impOk').disabled = true;
      const ok = await salvar(async () => {
        const criados = novosP.length ? await db.insert('tali_pacientes', novosP.map(({ _k, ...p }) => p)) : [];
        const ids = new Map(D.tali_pacientes.map(p => [chave(p.cns, p.nome), p.id])); criados.forEach(p => ids.set(chave(p.cns, p.nome), p.id));
        const ja = new Set(D.tali_dispensacoes.map(d => d.paciente_id + '|' + d.data + '|' + d.quantidade));
        const rows = novasD.map(({ _k, ...d }) => ({ ...d, paciente_id: ids.get(_k) })).filter(d => d.paciente_id && !ja.has(d.paciente_id + '|' + d.data + '|' + d.quantidade));
        for (let i = 0; i < rows.length; i += 200) await db.insert('tali_dispensacoes', rows.slice(i, i + 200));
      }, 'Planilha importada.');
      if (ok) $('dlg').close(); };
  } catch (e) { console.error(e); toast('Não foi possível ler a planilha. Confira se é o arquivo .xlsx no modelo oficial.'); }
}

  if (a === 'novoCaso') formCaso(b.dataset.ag);
  if (a === 'editCaso') { const c = D.sinan_casos.find(x => x.id === id); formCaso(c.agravo, c); }
  if (a === 'delCaso') dlg(`<div class="dlg"><h2>Excluir este caso da lista?</h2><div class="sub">O apontamento e a resposta do município também são apagados.</div><div class="row"><span></span><div class="gap"><button class="btn sec" data-a="fechar">Cancelar</button><button class="btn" data-a="delCasoOk" data-id="${id}">Excluir</button></div></div></div>`);
  if (a === 'delCasoOk') { await salvar(() => db.del('sinan_casos', id), 'Caso excluído.'); $('dlg').close(); }
});
