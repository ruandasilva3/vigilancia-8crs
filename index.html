<html lang="pt-BR">
<head>

<title>Vigilância em Saúde · SINAN</title>

:root{color-scheme:light;--ink:#18181B;--mut:#71717A;--mut2:#A1A1AA;--line:#E4E4E7;--line2:#F4F4F5;--soft:#FAFAFA;--blue:#2563EB;--ok:#15803D;--warn:#B45309;--bad:#B91C1C}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:#fff;color:var(--ink);font:14px/1.5 Inter,system-ui,Arial,sans-serif}
button,select,input{font:inherit;color:inherit}
a{color:var(--blue)}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.top{display:flex;align-items:center;gap:10px;padding:10px 28px;border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;background:#fff;z-index:10}
.top .crumb{color:var(--mut)}.top .sl{color:var(--mut2)}
.agr{width:auto;max-width:190px;min-height:36px;border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:0 8px;font-weight:600;cursor:pointer}
.nav{display:flex;gap:2px;margin-left:8px;flex-wrap:wrap}
.nav a{padding:7px 12px;border-radius:8px;color:var(--mut);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--line2);color:var(--ink)}
.nav a.on{background:var(--line2);color:var(--ink);font-weight:600}
.nav a .q{font-size:12px;color:var(--bad);margin-left:4px;font-weight:600}
.right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{min-height:36px;border:0;background:var(--ink);color:#fff;border-radius:8px;padding:0 14px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn.l{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn:hover{opacity:.9}
.demo{font-size:12px;color:var(--warn);border:1px solid #FCD9A8;background:#FFFBF2;border-radius:100px;padding:3px 10px}
main{max-width:1240px;margin:0 auto;padding:28px 28px 60px;display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.4px}
.head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.head .s{color:var(--mut)}.head .s b{color:var(--ink)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:100px;padding:0 4px 0 12px;min-height:34px;color:var(--mut);white-space:nowrap}
.pill select{border:0;background:transparent;font-weight:600;color:var(--ink);padding:6px 4px;cursor:pointer;appearance:auto}
.pill input{border:0;outline:0;background:transparent;padding:6px 8px 6px 0;width:200px;color:var(--ink)}
.pill:focus-within{border-color:var(--blue)}
.seg{display:flex;background:var(--line2);border-radius:8px;padding:3px}
.seg button{border:0;background:transparent;border-radius:6px;padding:5px 12px;color:var(--mut);cursor:pointer;min-height:30px}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.grp{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--mut)}
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{flex:none;border:0;background:none;padding:9px 0;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;min-height:40px}
.tabs button[aria-selected=true]{color:var(--ink);font-weight:600;border-color:var(--ink)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--mut);font-size:12px;font-weight:500;padding:8px 10px;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-top:1px solid var(--line2);vertical-align:top}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

td.nm{font-weight:500;min-width:170px}
td.un{min-width:170px;color:#3F3F46}

.split{display:grid;grid-template-columns:330px minmax(0,1fr);gap:24px;align-items:start}
.ulist{border:1px solid var(--line);border-radius:12px;padding:6px;max-height:calc(100vh - 120px);overflow:auto;position:sticky;top:64px}
.um{display:flex;justify-content:space-between;padding:12px 10px 4px;font-size:12px;color:var(--mut);font-weight:600}
.ui{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;border:0;background:none;text-align:left;padding:8px 10px;border-radius:8px;cursor:pointer;min-height:44px}
.ui:hover{background:var(--line2)}.ui.on{background:#EFF6FF;box-shadow:inset 3px 0 0 var(--blue)}
.ui .nm{font-weight:500}.ui .us{font-size:12px;color:var(--mut)}
.ui .bar1{height:4px;width:100%;background:var(--line2);border-radius:2px;margin-top:4px;overflow:hidden}.ui .bar1 i{display:block;height:100%;background:var(--ink)}
.um2{padding:4px 10px 8px}
.uh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;padding:2px 0 6px}
.uh b{font-size:17px}.uh .c{color:var(--mut)}
.ur{color:var(--mut);margin-bottom:6px;font-variant-numeric:tabular-nums}.ur b{color:var(--ink)}

td.end{min-width:220px;color:#3F3F46}
tr.g td{background:var(--soft);border-top:1px solid var(--line);cursor:pointer;padding:10px}
tr.g:hover td{background:var(--line2)}
.gh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.gh b{font-weight:600}.gh .c{color:var(--mut)}
.gh .t{color:var(--mut);font-variant-numeric:tabular-nums}
.gh .t b{color:var(--ink)}
tr.p{cursor:pointer}tr.p:hover td{background:#F8FAFF}
.z{display:inline-block;border-radius:4px;padding:1px 6px;font-size:12px;font-weight:600}
.z.r{background:#ECFCCB;color:#3F6212}.z.u{background:#DBEAFE;color:#1E40AF}.z.p{background:#F3E8FF;color:#6B21A8}
.dot{white-space:nowrap;font-weight:500}.dot::before{content:"● "}
.dot.ok{color:var(--ok)}.dot.warn{color:var(--warn)}.dot.bad{color:var(--bad)}.dot.mut{color:var(--mut)}
.tag{display:inline-block;font-size:12px;border-radius:4px;padding:1px 7px;margin:1px 3px 1px 0;white-space:nowrap}
.tag.e{background:#FEE2E2;color:#991B1B}.tag.i{background:#FEF3C7;color:#92400E}.tag.c{background:var(--line2);color:var(--mut)}
.pct.ok{color:var(--ok)}.pct.warn{color:var(--warn)}.pct.bad{color:var(--bad)}.pct{font-weight:600}
.rules{display:flex;flex-wrap:wrap;gap:6px}
.rules button{border:1px solid var(--line);background:#fff;border-radius:100px;padding:4px 12px;min-height:32px;cursor:pointer;color:#3F3F46}
.rules button b{margin-left:6px}
.rules button.e b{color:var(--bad)}.rules button.i b{color:var(--warn)}.rules button.c b{color:var(--mut)}
.rules button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}.rules button[aria-pressed=true] b{color:#fff}
.lnk{border:0;background:none;color:var(--mut);cursor:pointer;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
.note{font-size:12px;color:var(--mut);margin:4px 0 0;max-width:100ch}
.empty{color:var(--mut);padding:30px 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));border:1px solid var(--line);border-radius:12px}
.kpi{padding:16px 18px;border-left:1px solid var(--line)}.kpi:first-child{border-left:0}
.kpi .v{font-size:28px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--mut);font-size:13px}.kpi .d{font-size:12px;color:var(--mut2);margin-top:2px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:28px 40px}
h3{font-size:14px;font-weight:600;margin:0 0 10px}
.fig{position:relative;min-height:260px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.rows{display:grid;gap:6px}
.rw{display:grid;grid-template-columns:minmax(0,10em) minmax(0,1fr) 7em;gap:10px;align-items:center}
.rw .t{height:8px;background:var(--line2);border-radius:4px;overflow:hidden}.rw .t i{display:block;height:100%;background:var(--ink);border-radius:4px}
.rw.hi .t i{background:var(--blue)}
.rw .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--mut);white-space:nowrap}
.drop{border:1.5px dashed #D4D4D8;border-radius:12px;padding:40px;text-align:center;color:var(--mut)}
dialog{border:0;padding:0;margin:0 0 0 auto;height:100vh;max-height:100vh;width:min(560px,100vw);box-shadow:-8px 0 30px rgba(0,0,0,.12)}
dialog::backdrop{background:rgba(24,24,27,.25)}
.dw{padding:22px 24px;display:flex;flex-direction:column;gap:14px}
.det{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px}
.det div{padding:7px 0;border-bottom:1px solid var(--line2)}
.det span{display:block;font-size:12px;color:var(--mut)}
.ds{font-size:12px;font-weight:600;color:var(--mut);margin-top:6px;text-transform:none}
.hide{display:none!important}
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--soft)}

#login input{min-height:42px;border:1px solid var(--line);border-radius:8px;padding:0 12px;font-size:16px;color:var(--ink)}
#login .btn{min-height:44px}
.err{color:var(--bad);min-height:18px}
.who{color:var(--mut)}
.load{position:fixed;inset:0;background:rgba(255,255,255,.85);display:grid;place-items:center;z-index:50;font-size:16px;font-weight:600}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:5px 8px;border-radius:6px;display:none;z-index:20}

</style>
</head>

/* ---------- indicadores ---------- */
function ind(rows, A) {
  const nov = rows.filter(r => r.novo && r.ano === A);
  const exc = r => ['2','3','4','5','8','9'].includes(r.TPALTA_N);
  const coorte = rows.filter(r => r.novo && !exc(r) && ((r.CLASSATUAL === '1' && r.ano === A - 1) || (r.CLASSATUAL === '2' && r.ano === A - 2)));
  const cura = coorte.filter(r => r.TPALTA_N === '1').length, aband = coorte.filter(r => r.TPALTA_N === '7').length;
  const creg = coorte.reduce((s, r) => s + (num(r.CONTREG) || 0), 0), cex = coorte.reduce((s, r) => s + Math.min(num(r.CONTEXAM) || 0, num(r.CONTREG) || 0), 0);
  const aval = nov.filter(r => ['0','1','2'].includes(r.AVALIA_N));
  const curAno = rows.filter(r => r.TPALTA_N === '1' && r.dAlta && r.dAlta.getUTCFullYear() === A);
  return {novos:nov.length, mb:pct(nov.filter(r => r.CLASSATUAL === '2').length, nov.length), menor15:pct(nov.filter(r => r.idade != null && r.idade < 15).length, nov.length),
    gifAval:pct(aval.length, nov.length), gif2:pct(aval.filter(r => r.AVALIA_N === '2').length, aval.length),
    cura:pct(cura, coorte.length), aband:pct(aband, coorte.length), coorteN:coorte.length, cont:pct(cex, creg), creg, cex,
    gifCura:pct(curAno.filter(r => ['0','1','2'].includes(r.AVAL_ATU_N)).length, curAno.length), nov, coorte};
}

/* ---------- agrupamento ---------- */
const ZONA = {'1':['ZU','u','Zona urbana'],'2':['ZR','r','Zona rural'],'3':['ZP','p','Zona periurbana']};
const zona = r => { const z = ZONA[r.CS_ZONA]; return z ? `<span class="z ${z[1]}" title="${z[2]}">${z[0]}</span>` : v(''); };
const GRUPOS = {
  mun:{nome:'Município', k:r => r.mun, l:k => MUN[k] || k || 'Sem município'},
  un:{nome:'Unidade', k:r => r.un, l:nomeUn},
  zona:{nome:'Zona', k:r => r.CS_ZONA === '2' ? 'ZR' : r.CS_ZONA === '1' ? 'ZU' : r.CS_ZONA === '3' ? 'ZP' : '—', l:k => ({ZU:'Zona urbana (ZU)', ZR:'Zona rural (ZR)', ZP:'Zona periurbana (ZP)'})[k] || 'Zona não informada'},
  nada:{nome:'Nenhum'}
};
function contTot(rs) {
  let reg = 0, ex = 0, ur = 0, ue = 0, rr = 0, re = 0;
  rs.forEach(r => { const a = num(r.CONTREG) || 0, b = Math.min(num(r.CONTEXAM) || 0, a); reg += a; ex += b; if (r.CS_ZONA === '2') { rr += a; re += b; } else if (r.CS_ZONA === '1' || r.CS_ZONA === '3') { ur += a; ue += b; } });
  return {reg, ex, p:pct(ex, reg), zu:pct(ue, ur), zr:pct(re, rr)};
}
function resumoGrupo(rs, modo) {
  if (modo === 'cont') { const t = contTot(rs); return `<b>${nf(t.reg)}</b> registrados · <b>${nf(t.ex)}</b> examinados · <span class="pct ${cls(t.p)}">${fp(t.p)}</span> · ZU ${fp(t.zu)} · ZR ${fp(t.zr)}`; }
  if (modo === 'pend') { const e = rs.filter(r => r.p.some(c => REG[c][0] === 'e')).length; return `${e ? `<span style="color:var(--bad)">${e} para encerrar ou agir</span> · ` : ''}${rs.reduce((s, r) => s + r.p.length, 0)} pendências`; }
  const ab = rs.filter(r => r.aberto).length; return `<b>${ab}</b> em aberto · ${rs.length - ab} encerrados`;
}
function tabelaAgrupada(rs, cols, modo) {
  if (!rs.length) return '<div class="empty">Nenhum paciente nesta seleção.</div>';
  const G = GRUPOS[S.grp];
  const linhas = r => `<tr class="p" data-id="${r.i}">${cols.map(([, f, c]) => `<td class="${c || ''}">${f(r)}</td>`).join('')}</tr>`;
  let body = '';
  if (S.grp === 'nada') body = rs.slice(0, 500).map(linhas).join('') + (rs.length > 500 ? `<tr><td colspan="${cols.length}" class="note">Mostrando 500 de ${rs.length}. Use os filtros ou agrupe.</td></tr>` : '');
  else {
    const agrupa = (lista, kf) => { const g = new Map(); lista.forEach(r => { const k = kf(r); if (!g.has(k)) g.set(k, []); g.get(k).push(r); }); return [...g.entries()].sort((a, b) => b[1].length - a[1].length); };
    const cab = (cl, id, ab, titulo, lista) => `<tr class="${cl}" data-g="${esc(id)}"><td colspan="${cols.length}"><div class="gh"><span>${ab ? '▾' : '▸'} <b>${esc(titulo)}</b> <span class="c">· ${lista.length} paciente(s)</span></span><span class="t">${resumoGrupo(lista, modo)}</span></div></td></tr>`;
    const aninhado = S.grp === 'un' && !S.mun;
    const ord = aninhado ? agrupa(rs, r => r.mun) : agrupa(rs, G.k);
    const padrao = ord.length === 1 || rs.length <= 60;
    for (const [k, lista] of ord) {
      const id = (aninhado ? 'mun' : S.grp) + ':' + k, ab = S.aberto[id] ?? padrao;
      body += cab('g', id, ab, aninhado ? (MUN[k] || k) : G.l(k), lista);
      if (!ab) continue;
      if (!aninhado) { body += lista.map(linhas).join(''); continue; }
      for (const [u, sub] of agrupa(lista, r => r.un)) {
        const id2 = 'un:' + k + '|' + u, ab2 = S.aberto[id2] ?? false;
        body += cab('gs', id2, ab2, nomeUn(u), sub);
        if (ab2) body += sub.map(linhas).join('');
      }
    }
  }
  return `<div class="tw"><table><thead><tr>${cols.map(([t, , c]) => `<th class="${c === 'n' ? 'n' : ''}">${t}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>
  ${S.grp !== 'nada' ? '<div class="bar"><button class="lnk" type="button" data-todos="1">Expandir todos</button><button class="lnk" type="button" data-todos="0">Recolher todos</button></div>' : ''}`;
}
const agrupaBy = (lista, kf) => { const g = new Map(); lista.forEach(r => { const k = kf(r); if (!g.has(k)) g.set(k, []); g.get(k).push(r); }); return [...g.entries()].sort((a, b) => b[1].length - a[1].length); };
function resumoUn(l, modo) {
  if (modo === 'cont') { const t = contTot(l); return `${l.length} pac. · ${t.ex}/${t.reg} contatos · <span class="pct ${cls(t.p)}">${fp(t.p)}</span>`; }
  if (modo === 'pend') return `${l.length} paciente(s) com pendência`;
  const ab = l.filter(r => r.aberto).length; return `${l.length} paciente(s)${S.sit === 'aberto' ? '' : ` · ${ab} em aberto`}`;
}
function tabelaFlat(rs, cols) {
  if (!rs.length) return '<div class="empty">Nenhum paciente.</div>';
  const L = rs.slice(0, 500);
  return `<div class="tw"><table><thead><tr>${cols.map(([t, , c]) => `<th class="${c === 'n' ? 'n' : ''}">${t}</th>`).join('')}</tr></thead><tbody>${L.map(r => `<tr class="p" data-id="${r.i}">${cols.map(([, f, c]) => `<td class="${c || ''}">${f(r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${rs.length > 500 ? `<p class="note">Mostrando 500 de ${rs.length}.</p>` : ''}`;
}
function viewUnidades(rs, cols, modo) {
  if (!rs.length) return '<div class="empty">Nenhum paciente nesta seleção.</div>';
  const chave = r => r.mun + '|' + r.un;
  const sel = S.unSel && rs.some(r => chave(r) === S.unSel) ? S.unSel : '';
  const maxU = Math.max(...agrupaBy(rs, chave).map(x => x[1].length));
  let lista = `<button class="ui ${sel ? '' : 'on'}" type="button" data-un=""><span class="nm">Todas as unidades</span><span class="us">${resumoUn(rs, modo)}</span></button>`;
  for (const [m, lm] of agrupaBy(rs, r => r.mun)) {
    const us = agrupaBy(lm, r => r.un), big = us.filter(x => x[1].length > 2), small = us.filter(x => x[1].length <= 2);
    lista += `<div class="um"><span>${esc(MUN[m] || m)}</span><span>${lm.length} pac. · ${us.length} unidade(s)</span></div>`;
    const item = ([u, l]) => `<button class="ui ${sel === m + '|' + u ? 'on' : ''}" type="button" data-un="${esc(m + '|' + u)}"><span class="nm">${esc(nomeUn(u))}</span><span class="us">${resumoUn(l, modo)}</span><span class="bar1"><i style="width:${l.length / maxU * 100}%"></i></span></button>`;
    lista += big.map(item).join('');
    if (small.length) {
      if (!big.length || S.aberto['outras:' + m] || small.some(([u]) => sel === m + '|' + u)) lista += small.map(item).join('');
      else lista += `<div class="um2"><button class="lnk" type="button" data-outras="${m}">+ ${small.length} unidade(s) com 1 ou 2 pacientes (${small.reduce((s, x) => s + x[1].length, 0)} no total)</button></div>`;

  return `<div class="split"><div class="ulist" role="list">${lista}</div>
    <div><div class="uh"><div><b>${sel ? esc(nomeUn(su)) : 'Todas as unidades'}</b> <span class="c">· ${sel ? esc(MUN[sm] || sm) + ' · ' : ''}${alvo.length} paciente(s)</span></div>${sel && su ? `<span class="c">CNES ${esc(su)}</span>` : ''}</div>
    <div class="ur">${resumoGrupo(alvo, modo)}</div>
    ${tabelaFlat(ordAlvo, sel ? cols.filter(c => c !== C.un) : cols)}</div></div>`;
}
const barraGrupo = () => `<div class="grp">Agrupar por <div class="seg" role="group">${Object.entries(GRUPOS).map(([k, g]) => `<button type="button" data-grp="${k}" aria-pressed="${S.grp === k}">${g.nome}</button>`).join('')}</div></div>`;

/* ---------- pacientes ---------- */
const situ = r => r.aberto ? '<span class="dot warn">Em aberto</span>' : `<span class="dot ${r.TPALTA_N === '1' ? 'ok' : r.TPALTA_N === '7' || r.TPALTA_N === '6' ? 'bad' : 'mut'}">${esc(LBL.ALTA[r.TPALTA_N] || r.TPALTA_N)}</span>`;
const endereco = r => [r.NM_LOGRADO, r.NU_NUMERO, r.NM_COMPLEM, r.NM_BAIRRO].filter(Boolean).join(', ') + (r.NM_REFEREN ? ` (ref.: ${r.NM_REFEREN})` : '');
const tel = r => r.NU_TELEFON ? `(${r.NU_DDD_TEL || '91'}) ${r.NU_TELEFON}` : '';
const doses = r => { const d = num(r.DOSE_RECEB), t = r.ESQ_ATU_N === '1' ? 6 : r.ESQ_ATU_N === '2' ? 12 : null; return d == null ? '—' : t ? `${d} de ${t}` : String(d); };
const C = {
  nu:['Nº SINAN', r => esc(r.NU_NOTIFIC), 'd'], nome:['Paciente', r => esc(r.NM_PACIENT), 'nm'], sit:['Situação', situ], res:['Res.', zona],
  un:['Unidade', r => r.un ? `<span title="CNES ${esc(r.un)}">${esc(nomeUn(r.un))}</span>` : v(''), 'un'], dx:['Diagnóstico', r => fd(r.dDiag), 'd']
};
const ABAS = {
  ident:{nome:'Identificação', cols:[C.nu, ['Notificação', r => fd(r.dNot), 'd'], C.nome, C.sit, ['Nascimento', r => fd(r.dNasc), 'd'], ['Idade', r => r.idade ?? '—', 'n'], ['Sexo', r => r.CS_SEXO || '—'], ['Mãe', r => v(r.NM_MAE_PAC)], ['Endereço', r => v(endereco(r)), 'end'], C.res, ['Telefone', r => v(tel(r)), 'd']]},
  clin:{nome:'Clínica', cols:[C.nu, C.nome, C.sit, C.dx, ['Forma clínica', r => v(LBL.FORMA[r.FORMACLINI])], ['Classificação', r => `${LBL.CL[r.CLASSOPERA] || '—'} → ${LBL.CL[r.CLASSATUAL] || '—'}`, 'd'], ['Lesões', r => v(r.NU_LESOES), 'n'], ['Nervos', r => v(r.NERVOSAFET), 'n'], ['Baciloscopia', r => v(LBL.BAC[r.BACILOSCO])], ['Grau diagn.', r => v(LBL.GIF[r.AVALIA_N])], ['Entrada', r => v(LBL.ENTR[r.MODOENTR])], ['Detecção', r => v(LBL.DET[r.MODODETECT])]]},
  cont:{nome:'Contatos', modo:'cont', cols:[C.nu, C.nome, C.sit, C.res, C.un, C.dx, ['Reg.', r => v(r.CONTREG), 'n'],
    ['Exam.', r => { const a = num(r.CONTREG), b = num(r.CONTEXAM); return a && (b || 0) < a ? `<span style="color:var(--bad);font-weight:600">${b ?? 0}</span>` : v(r.CONTEXAM); }, 'n'],
    ['% exam.', r => { const a = num(r.CONTREG); if (!a) return '—'; const p = Math.min(num(r.CONTEXAM) || 0, a) / a * 100; return `<span class="pct ${cls(p)}">${fp(p)}</span>`; }, 'n']]},
  trat:{nome:'Tratamento', cols:[C.nu, C.nome, C.sit, ['Início', r => fd(r.dIni), 'd'], ['Esquema inicial', r => v(LBL.ESQ[r.ESQ_INI_N])], ['Esquema atual', r => v(LBL.ESQ[r.ESQ_ATU_N])], ['Mudança', r => fd(r.dMud), 'd'], ['Doses', doses, 'n'], ['Últ. comparecimento', r => fd(r.dUlt) + (r.aberto && r.dUlt ? ` <span style="color:var(--mut2)">(${dias(HOJE, r.dUlt)} d)</span>` : ''), 'd'], ['Episódio reacional', r => v(LBL.REAC[r.EPIS_RACIO])]]},
  enc:{nome:'Encerramento', cols:[C.nu, C.nome, C.dx, ['Classif.', r => v(LBL.CL[r.CLASSATUAL])], ['Doses', doses, 'n'], C.sit, ['Data da saída', r => fd(r.dAlta), 'd'], ['Grau na saída', r => v(LBL.GIF[r.AVAL_ATU_N])], ['Tempo', r => { const a = r.dIni || r.dDiag, b = r.dAlta || HOJE; return a ? Math.round(dias(b, a) / 30.4) + ' meses' : '—'; }, 'n']]}

function filtraPac() {
  const q = S.q.trim().toLowerCase();
  return DB.filter(r => noMun(r) && (q && S.sit === 'aberto' ? true : S.sit === 'aberto' ? r.aberto : S.sit === 'enc' ? !r.aberto && noPer(r) : r.aberto || noPer(r))

/* ---------- pendências ---------- */
function pendencias() {
  let rs = DB.filter(r => noMun(r) && noPer(r) && r.p.length);
  if (S.sev !== 'todas') rs = rs.filter(r => r.p.some(c => REG[c][0] !== 'c'));
  const cont = {}; rs.forEach(r => r.p.forEach(c => cont[c] = (cont[c] || 0) + 1));
  if (S.regra && !cont[S.regra]) S.regra = '';
  if (S.regra) rs = rs.filter(r => r.p.includes(S.regra));
  if (S.q) { const q = S.q.toLowerCase(); rs = rs.filter(r => (r.NM_PACIENT || '').toLowerCase().includes(q) || (r.NU_NOTIFIC || '').includes(q)); }
  rs.sort((a, b) => b.p.filter(c => REG[c][0] === 'e').length - a.p.filter(c => REG[c][0] === 'e').length || (a.NM_PACIENT || '').localeCompare(b.NM_PACIENT || ''));
  const ord = {e:0, i:1, c:2};
  const chips = Object.keys(REG).filter(c => cont[c]).sort((a, b) => ord[REG[a][0]] - ord[REG[b][0]] || cont[b] - cont[a])
    .map(c => `<button type="button" class="${REG[c][0]}" data-regra="${c}" aria-pressed="${S.regra === c}">${REG[c][1]}<b>${cont[c]}</b></button>`).join('');
  const cols = [C.nu, C.nome, C.sit, C.res, C.dx, ['Pendências', r => r.p.map(c => `<span class="tag ${REG[c][0]}">${REG[c][1]}</span>`).join('')]];
  $('main').innerHTML = `
  <div class="head"><h1>Pendências</h1><span class="s">${nf(rs.length)} pacientes · <b>${rs.filter(r => r.p.some(c => REG[c][0] === 'e')).length} para encerrar ou agir</b></span></div>
  <div class="bar">
    ${pillPer()}${pillMun()}
    <label class="pill">Mostrar: <select data-f="sev"><option value="todas">Todas</option><option value="sem" ${S.sev !== 'todas' ? 'selected' : ''}>Sem completude</option></select></label>
    <label class="pill">Buscar <input type="search" id="fQ" value="${esc(S.q)}" placeholder="nome ou nº SINAN"></label>

  <p class="note">Prazos contados até hoje (${fd(HOJE)}). Vermelho: encerrar ou agir · amarelo: inconsistência · cinza: completude. Clique numa regra para filtrar.</p>`;

/* ---------- painel ---------- */
function painel() {
  const base = DB.filter(r => S.mun ? r.res === S.mun : r.res in MUN), I = ind(base, S.ano), P = ind(base, S.ano - 1);
  const abertos = DB.filter(r => r.aberto && noMun(r)).length, pend = DB.filter(r => noMun(r) && noPer(r) && r.p.some(c => REG[c][0] !== 'c')).length;
  const k = (val, l, d, c = '') => `<div class="kpi"><div class="v ${c}">${val}</div><div class="l">${l}</div><div class="d">${d}</div></div>`;
  const serie = []; for (let y = Math.max(INFO.min, INFO.max - 14); y <= INFO.max; y++) serie.push([y, base.filter(r => r.novo && r.ano === y).length]);
  const porMun = Object.entries(MUN).map(([c, n]) => [c, n, DB.filter(r => r.res === c && r.novo && r.ano === S.ano).length]), mx = Math.max(1, ...porMun.map(x => x[2]));
  const barras = (it, t, hi) => it.map(([l, n]) => `<div class="rw ${hi && hi(l) ? 'hi' : ''}"><span>${esc(l)}</span><span class="t"><i style="width:${n / t * 100}%"></i></span><span class="n">${n} · ${fp(n / t * 100)}</span></div>`).join('');
  const dist = (title, key, lab) => { const cnt = {}; I.nov.forEach(r => { const x = lab[r[key]] || (r[key] ? 'Código ' + r[key] : 'Em branco'); cnt[x] = (cnt[x] || 0) + 1; });
    return `<div><h3>${title}</h3><div class="rows">${barras(Object.entries(cnt).sort((a, b) => b[1] - a[1]), I.nov.length) || '<div class="empty">Sem casos novos no ano.</div>'}</div></div>`; };
  const cel = x => `<td class="n"><span class="pct ${cls(x)}">${fp(x)}</span></td>`;
  const linha = (n, x, ab, bold) => `<tr${bold ? ' style="font-weight:600;background:var(--soft)"' : ''}><td>${n}</td><td class="n">${x.novos}</td><td class="n">${fp(x.mb)}</td><td class="n">${fp(x.menor15)}</td>${cel(x.gifAval)}<td class="n">${fp(x.gif2)}</td>${cel(x.cura)}<td class="n">${fp(x.aband)}</td>${cel(x.cont)}${cel(x.gifCura)}<td class="n">${ab}</td></tr>`;
  const munRows = (S.mun ? [[S.mun, MUN[S.mun]]] : Object.entries(MUN)).map(([c, n]) => linha(n, ind(DB.filter(r => r.res === c), S.ano), DB.filter(r => r.aberto && r.mun === c).length)).join('') + (S.mun ? '' : linha('8º CRS', I, abertos, true));
  const sai = {}; I.coorte.forEach(r => { const x = r.TPALTA_N ? LBL.ALTA[r.TPALTA_N] || r.TPALTA_N : 'Em aberto'; sai[x] = (sai[x] || 0) + 1; });
  $('main').innerHTML = `
  <div class="head"><h1>Painel</h1><span class="s">${S.mun ? MUN[S.mun] : 'Marajó II · 8º CRS'} · indicadores por município de residência</span></div>
  <div class="bar"><label class="pill">Ano de avaliação: <select data-f="ano">${anosOpt(S.ano)}</select></label>${pillMun()}</div>
  <div class="kpis">
    ${k(I.novos, 'Casos novos em ' + S.ano, P.novos ? `${I.novos - P.novos >= 0 ? '+' : ''}${I.novos - P.novos} em relação a ${S.ano - 1}` : '')}
    ${k(`<span class="pct ${cls(I.cura)}">${fp(I.cura)}</span>`, 'Cura nas coortes', `${I.coorteN} casos · PB ${S.ano - 1}, MB ${S.ano - 2}`)}
    ${k(`<span class="pct ${cls(I.cont)}">${fp(I.cont)}</span>`, 'Contatos examinados', `${nf(I.cex)} de ${nf(I.creg)} nas coortes`)}
    ${k(`<span class="pct ${cls(I.gifAval)}">${fp(I.gifAval)}</span>`, 'Grau avaliado no diagnóstico', `grau II: ${fp(I.gif2)} dos avaliados`)}
    ${k(abertos, 'Em aberto hoje', '<a href="#pacientes">ver pacientes</a>')}
    ${k(pend, 'Com pendência', '<a href="#pendencias">ver pendências</a>')}
  </div>
  <div class="g2">
    <div><h3>Casos novos por ano de diagnóstico</h3><div class="fig" id="fSerie"><svg></svg></div></div>
    <div><h3>Casos novos por município · ${S.ano}</h3><div class="rows">${porMun.map(([c, n, x]) => `<div class="rw ${c === S.mun ? 'hi' : ''}"><span>${n}</span><span class="t"><i style="width:${x / mx * 100}%"></i></span><span class="n">${x}</span></div>`).join('')}</div>
      <h3 style="margin-top:22px">Encerramento das coortes</h3><div class="rows">${barras(Object.entries(sai).sort((a, b) => b[1] - a[1]), I.coorteN, l => l === 'Abandono') || '<div class="empty">Coorte vazia.</div>'}</div></div>
  </div>
  <div><h3>Indicadores por município</h3>
  <div class="tw"><table><thead><tr><th>Município</th><th class="n">Casos novos</th><th class="n">% MB</th><th class="n">% &lt; 15 anos</th><th class="n">Grau aval. diagn.</th><th class="n">% grau II</th><th class="n">Cura coortes</th><th class="n">Abandono</th><th class="n">Contatos exam.</th><th class="n">Grau aval. cura</th><th class="n">Em aberto</th></tr></thead><tbody>${munRows}</tbody></table></div>
  <p class="note">Cores: <span class="dot ok">≥ 90% bom</span> · <span class="dot warn">75–89,9% regular</span> · <span class="dot bad">&lt; 75% precário</span>. Coorte: PB diagnosticados em ${S.ano - 1} e MB em ${S.ano - 2}, sem transferências e erro diagnóstico.</p></div>
  <div class="g2">${dist('Classificação operacional · casos novos ' + S.ano, 'CLASSATUAL', LBL.CLASS)}${dist('Grau de incapacidade no diagnóstico', 'AVALIA_N', LBL.GIF)}${dist('Modo de detecção', 'MODODETECT', LBL.DET)}${dist('Forma clínica', 'FORMACLINI', LBL.FORMA)}</div>`;
  serieChart(serie);
}
function serieChart(serie) {
  const box = $('fSerie'), s = box.querySelector('svg'), tip = $('tip');
  const draw = () => {
    const W = s.clientWidth, H = s.clientHeight; if (!s.isConnected || W < 60 || H < 60) return;
    const m = {l:30, r:4, t:20, b:24}, n = serie.length, max = Math.max(1, ...serie.map(x => x[1]));
    const step = Math.max(1, Math.ceil(max / 4 / 5) * 5), top = Math.ceil(max / step) * step, bw = (W - m.l - m.r) / n, y = x => H - m.b - x / top * (H - m.t - m.b);
    let g = '';
    for (let t = 0; t <= top; t += step) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}" stroke="#F4F4F5"/><text x="${m.l - 6}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="#A1A1AA">${t}</text>`;
    const every = W < 520 ? Math.ceil(n / 5) : Math.ceil(n / 12);
    serie.forEach(([a, val], i) => {
      const x = m.l + i * bw + bw * .2, w = Math.max(2, bw * .6), hi = a === S.ano, h = y(0) - y(val), rr = Math.min(3, h, w / 2);
      if (h > 0) g += `<path d="M${x},${y(0)}V${y(val) + rr}q0,-${rr} ${rr},-${rr}h${w - 2 * rr}q${rr},0 ${rr},${rr}V${y(0)}Z" fill="${hi ? '#2563EB' : '#18181B'}"/>`;
      g += `<rect x="${m.l + i * bw}" y="${m.t}" width="${bw}" height="${H - m.t - m.b}" fill="transparent" style="cursor:pointer" data-a="${a}" data-v="${val}"/>`;
      if ((n - 1 - i) % every === 0) g += `<text x="${x + w / 2}" y="${H - 6}" text-anchor="middle" font-size="11" fill="#A1A1AA">${W < 520 ? String(a).slice(2) : a}</text>`;
      if (hi) g += `<text x="${x + w / 2}" y="${y(val) - 6}" text-anchor="middle" font-size="12" font-weight="600" fill="#18181B">${val}</text>`;
    });
    s.innerHTML = g;
  };
  draw(); if (window._ro) window._ro.disconnect(); window._ro = new ResizeObserver(draw); window._ro.observe(box);
  s.onmousemove = e => { const t = e.target.dataset; if (!t.a) { tip.style.display = 'none'; return; } tip.textContent = `${t.a}: ${t.v} casos novos · clique para avaliar este ano`; Object.assign(tip.style, {display:'block', left:e.clientX + 12 + 'px', top:e.clientY - 30 + 'px'}); };
  s.onmouseleave = () => tip.style.display = 'none';
  s.onclick = e => { const a = +e.target.dataset.a; if (a) { S.ano = a; tip.style.display = 'none'; render(); } };
}

/* ---------- importar ---------- */
function importar() {
  $('main').innerHTML = `
  <div class="head"><h1>Importar banco</h1><span class="s">Hanseníase · substitui o banco inteiro</span></div>
  <div class="s" style="color:var(--mut)">Banco atual: <b style="color:var(--ink)">${esc(INFO.nome)}</b> · ${nf(DB.length)} registros · diagnósticos de ${INFO.min} a ${INFO.max} · última digitação ${fd(INFO.dig)} · carregado em ${INFO.em}</div>
  <div class="drop" id="drop"><p style="margin:0 0 14px">Arraste aqui o arquivo exportado do SINAN (DBF ou CSV)</p><button class="btn" type="button" id="btnImp">Escolher arquivo</button></div>
  <p class="note">Use sempre os nomes de campo originais do SINAN (NU_NOTIFIC, DT_DIAG, TPALTA_N…). As pendências incluídas à mão no site não são afetadas. Os municípios veem só os pacientes deles. Cada computador guarda uma cópia do banco e só baixa de novo quando houver importação nova.${DEMO ? ' <b>Modo demonstração:</b> o arquivo é lido só neste navegador e não é salvo.' : ''}</p>
  ${DEMO ? '' : '<div><button class="btn l" type="button" id="btnRecarregar">Baixar o banco de novo do servidor</button></div>'}`;
  const d = $('drop');
  d.ondragover = e => { e.preventDefault(); d.style.background = 'var(--soft)'; };
  d.ondragleave = () => d.style.background = '';
  d.ondrop = e => { e.preventDefault(); d.style.background = ''; if (e.dataTransfer.files[0]) ler(e.dataTransfer.files[0]); };
}
async function ler(f) {
  try {
    const buf = await f.arrayBuffer(), antes = DB.length;
    const raw = /\.dbf$/i.test(f.name) ? parseDBF(buf) : parseCSV(decodeText(buf));
    const falta = OBRIG.filter(k => !(k in (raw[0] || {})));
    if (!raw.length || falta.length) throw new Error('O arquivo não parece ser o banco de hanseníase do SINAN. Faltam as colunas: ' + falta.join(', '));
    if (DEMO) carregar(raw, {nome:f.name, exemplo:false, em:new Date().toLocaleString('pt-BR')});
    else {
      const linhas = raw.map(o => { const x = {}; CAMPOS.forEach(k => { if (o[k]) x[k] = o[k]; }); return x; });
      const p = pdate(raw.reduce((m, o) => (o.DT_DIGITA || '') > m ? o.DT_DIGITA : m, ''));
      $('load').textContent = `Gravando ${nf(linhas.length)} registros…`; $('load').classList.remove('hide');
      const {error} = await db.rpc('sinan_substituir', {p_linhas: linhas, p_arquivo: f.name, p_ultima: p ? p.toISOString().slice(0, 10) : null});
      $('load').classList.add('hide');
      if (error) throw new Error('O Supabase recusou a gravação: ' + error.message);
      const {data: imp} = await db.from('sinan_importacoes').select('id,arquivo,importado_em').order('id', {ascending:false}).limit(1);
      const i = imp && imp[0], rows = linhas.map(normaliza);
      if (i) await IDB.set(chaveCache(), {versao: i.id, rows});
      carregar(rows, {nome: f.name, exemplo:false, em: new Date().toLocaleString('pt-BR'), fonte:'servidor'});
    }
    location.hash = '#pacientes';
    drawer(`<h2 style="margin:0">Banco substituído</h2><p>Os ${nf(antes)} registros anteriores foram trocados por <b>${esc(f.name)}</b>, com ${nf(DB.length)} registros.</p><div><button class="btn" type="button" data-close="1">Ok</button></div>`);
  } catch (err) {
    drawer(`<h2 style="margin:0">Não foi possível importar</h2><p style="color:var(--bad)">${esc(err.message)}</p><div><button class="btn" type="button" data-close="1">Fechar</button></div>`);
  }
}
const drawer = h => { $('dlgB').innerHTML = h; $('dlg').showModal(); $('dlg').scrollTop = 0; };

/* ---------- ficha (painel lateral) ---------- */
function ficha(r) {
  const kv = (l, x) => `<div><span>${l}</span>${x ? esc(x) : '—'}</div>`;
  drawer(`<div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div><h2 style="margin:0;font-size:20px">${esc(r.NM_PACIENT)}</h2><div style="color:var(--mut)">Nº SINAN ${esc(r.NU_NOTIFIC)} · ${esc(MUN[r.mun] || r.mun)}${r.un ? ' · ' + esc(nomeUn(r.un)) + ' (CNES ' + esc(r.un) + ')' : ''}</div></div><button class="btn l" type="button" data-close="1" aria-label="Fechar">Fechar</button></div>
  <div>${situ(r)} &nbsp; ${zona(r)}</div>
  ${r.p.length ? `<div>${r.p.map(c => `<div class="tag ${REG[c][0]}" style="display:block;padding:7px 10px;margin-bottom:5px;white-space:normal"><b>${REG[c][1]}.</b> ${REG[c][2]}</div>`).join('')}</div>` : ''}
  <div class="ds">Identificação</div><div class="det">
    ${kv('Notificação', fd(r.dNot))}${kv('Nascimento', fd(r.dNasc) + (r.idade != null ? ` · ${r.idade} anos` : ''))}${kv('Sexo', LBL.SEXO[r.CS_SEXO])}${kv('Mãe', r.NM_MAE_PAC)}
    ${kv('Cartão SUS', r.ID_CNS_SUS)}${kv('Telefone', tel(r))}${kv('Endereço', endereco(r))}${kv('Zona', LBL.ZONA[r.CS_ZONA])}${kv('CEP', r.NU_CEP)}${kv('Residência', MUN[r.res] || r.res)}</div>
  <div class="ds">Clínica</div><div class="det">
    ${kv('Diagnóstico', fd(r.dDiag))}${kv('Modo de entrada', LBL.ENTR[r.MODOENTR])}${kv('Modo de detecção', LBL.DET[r.MODODETECT])}${kv('Forma clínica', LBL.FORMA[r.FORMACLINI])}
    ${kv('Classificação', `${LBL.CLASS[r.CLASSOPERA] || '—'} → ${LBL.CLASS[r.CLASSATUAL] || '—'}`)}${kv('Lesões', r.NU_LESOES)}${kv('Nervos afetados', r.NERVOSAFET)}${kv('Baciloscopia', LBL.BAC[r.BACILOSCO])}${kv('Grau no diagnóstico', LBL.GIF[r.AVALIA_N])}</div>
  <div class="ds">Contatos e tratamento</div><div class="det">
    ${kv('Contatos registrados', r.CONTREG)}${kv('Contatos examinados', r.CONTEXAM)}${kv('Início do tratamento', fd(r.dIni))}${kv('Esquema atual', LBL.ESQ[r.ESQ_ATU_N])}
    ${kv('Doses recebidas', doses(r))}${kv('Último comparecimento', fd(r.dUlt))}${kv('Episódio reacional', LBL.REAC[r.EPIS_RACIO])}${kv('Mudança de esquema', fd(r.dMud))}</div>
  <div class="ds">Encerramento</div><div class="det">
    ${kv('Tipo de saída', r.aberto ? 'Em aberto' : LBL.ALTA[r.TPALTA_N] || r.TPALTA_N)}${kv('Data da saída', fd(r.dAlta))}${kv('Grau na saída', LBL.GIF[r.AVAL_ATU_N])}${kv('Digitação', fd(r.dDig))}</div>`);
}

/* ---------- eventos ---------- */
window.addEventListener('hashchange', () => { S.q = ''; render(); });
$('dlg').addEventListener('click', e => { if (e.target === $('dlg') || e.target.closest('[data-close]')) $('dlg').close(); });
$('main').addEventListener('click', e => {
  const b = e.target.closest('button,tr.p,tr.g,tr.gs'); if (!b) return;
  const d = b.dataset;
  if (d.aba) { S.aba = d.aba; render(); }
  else if (d.grp) { S.grp = d.grp; render(); }
  else if (d.g) { const ab = b.querySelector('.gh span').textContent.trim().startsWith('▾'); S.aberto[d.g] = !ab; render(); }
  else if ('un' in d) { S.unSel = d.un; render(); }
  else if (d.outras) { S.aberto['outras:' + d.outras] = true; render(); }
  else if (d.todos) { document.querySelectorAll('tr.g,tr.gs').forEach(t => S.aberto[t.dataset.g] = d.todos === '1'); render(); }
  else if (d.regra) { S.regra = S.regra === d.regra ? '' : d.regra; render(); }
  else if (b.id === 'btnCopy') copiar(b);
  else if (b.id === 'btnImp') $('arq').click();
  else if (b.id === 'btnRecarregar') buscar(true);
  else if (b.id === 'btnEx') { carregar(parseCSV(SAMPLE), {nome:'Banco de exemplo', exemplo:true, em:new Date().toLocaleString('pt-BR')}); }
  else if (d.id) ficha(DB[+d.id]);
});
$('main').addEventListener('change', e => {
  const f = e.target.dataset.f; if (!f) return;
  const val = e.target.value;
  if (f === 'mun') S.mun = val; else if (f === 'sit') S.sit = val; else if (f === 'sev') S.sev = val === 'sem' ? 'sem' : 'todas';
  else if (f === 'ano') S.ano = +val;
  else if (f === 'de') { S.de = +val; if (S.de > S.ate) S.ate = S.de; }
  else if (f === 'ate') { S.ate = +val; if (S.ate < S.de) S.de = S.ate; }
  render();
});
$('main').addEventListener('input', e => { if (e.target.id === 'fQ') { S.q = e.target.value; const p = e.target.selectionStart; render(); const i = $('fQ'); i.focus(); i.setSelectionRange(p, p); } });
$('arq').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) ler(f); };
async function copiar(b) {
  const [L, cols] = window._lista || [[], []], tx = x => String(x).replace(/<[^>]+>/g, '').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/\s+/g, ' ').trim();
  const t = [['Município', ...cols.map(c => c[0])].join('\t'), ...L.map(r => [MUN[r.mun] || r.mun, ...cols.map(([, f]) => tx(f(r)))].join('\t'))].join('\n');
  try { await navigator.clipboard.writeText(t); b.textContent = `Copiado (${L.length}) · cole no Excel`; } catch { b.textContent = 'Não foi possível copiar'; }
  setTimeout(() => { b.textContent = 'Copiar tabela'; }, 2500);
}
async function buscar(forcar) {
  try {
    const {data: imp, error: e1} = await db.from('sinan_importacoes').select('id,arquivo,importado_em').order('id', {ascending:false}).limit(1);
    if (e1) throw e1;
    const i = imp && imp[0];
    if (!i) {
      DB = []; INFO = {nome:'nenhum banco importado', min:0, max:0, em:'—'};
      if (USER.regional) { history.replaceState(null, '', '#importar'); importar(); }
      else $('main').innerHTML = '<div class="head"><h1>Pacientes</h1></div><div class="empty">A regional ainda não importou o banco do SINAN.</div>';
      return;
    }
    const c = forcar ? null : await IDB.get(chaveCache());
    let rows, fonte = 'cache';
    if (c && c.versao === i.id && c.rows && c.rows.length) rows = c.rows;
    else {
      fonte = 'servidor';
      $('load').textContent = 'Baixando o banco (só acontece quando há importação nova)…'; $('load').classList.remove('hide');
      rows = []; let de = 0;
      for (;;) {
        const {data, error} = await db.from('sinan_hans').select('dados').order('id').range(de, de + 999);
        if (error) throw error;
        rows.push(...data.map(x => normaliza(x.dados)));
        if (data.length < 1000) break; de += 1000;
      }
      await IDB.set(chaveCache(), {versao: i.id, rows});
    }
    carregar(rows, {nome: i.arquivo, exemplo:false, em: new Date(i.importado_em).toLocaleString('pt-BR'), fonte});
  } catch (e) { $('main').innerHTML = `<div class="head"><h1>Não foi possível carregar</h1></div><p class="err">${esc(e.message || e)}</p>`; }
  finally { $('load').classList.add('hide'); }
}
function entrar(email) {
  const login = email.split('@')[0];
  USER = {login, regional: login === 'regional', mun: LOGIN_MUN[login] || ''};
  if (!USER.regional && !USER.mun) { $('lErr').textContent = 'Usuário sem acesso a este módulo.'; db.auth.signOut(); return false; }
  $('who').textContent = USER.regional ? 'Regional' : MUN[USER.mun]; $('navImp').classList.toggle('hide', !USER.regional);
  $('login').classList.add('hide'); $('app').classList.remove('hide');
  return true;
}
$('fLogin').onsubmit = async e => {
  e.preventDefault(); $('lErr').textContent = '';
  const u = $('lUser').value.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, '');
  const email = u.includes('@') ? u : u + DOMINIO;
  const {error} = await db.auth.signInWithPassword({email, password: $('lSenha').value});
  if (error) { $('lErr').textContent = 'Usuário ou senha incorretos.'; return; }
  if (entrar(email)) buscar();
};
$('sair').onclick = async () => { if (DEMO) return; await db.auth.signOut(); location.reload(); };
if (!location.hash) history.replaceState(null, '', '#pacientes');
if (DEMO) {
  $('app').classList.remove('hide'); $('who').textContent = 'Demonstração'; $('sair').classList.add('hide');
  carregar(parseCSV(SAMPLE), {nome:'Banco de exemplo', exemplo:true, em:new Date().toLocaleString('pt-BR')});
} else {
  db.auth.getSession().then(({data}) => { const s = data.session; if (s && entrar(s.user.email)) buscar(); else $('login').classList.remove('hide'); });
}
}
